[workspace]
resolver = "2"
members = [
    "sentinel-core",
    "sentinel-edge",
    "sentinel-neural",
    "sentinel-behavior",
    "sentinel-response",
    "sentinel-persistence",
    "sentinel-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/adoslabsproject-gif/cerbero-sentinel-waf"
authors = ["Nicola Cucurachi <ados.labsproject@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full", "tracing"] }
tokio-stream = "0.1"

# HTTP client (Sentinel → Portal persistence). rustls-only, no openssl (no
# system dep su build minimal). HTTP/2 via hyper, gzip ottimizza payload jsonb.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "gzip",
    "json",
    "charset",
] }

# Modern exponential backoff (successor di `backoff` crate legacy). Jitter
# integrato per evitare thundering herd su retry concorrenti.
backon = "1.3"

# HTTP
axum = { version = "0.8", features = ["http2", "tracing"] }
hyper = { version = "1.6", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "timeout"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrent data structures
dashmap = "6.0"
crossbeam = "0.8"
parking_lot = "0.12"
lru = "0.12" # true-O(1) LRU; usato dal primitivo condiviso ShardedLru (SESSION1 + gemelli)

# ML Inference
ort = { version = "2.0.0-rc.11" }
ndarray = "0.16"

# Cryptography
sha2 = "0.10"
base64 = "0.22"

# Utilities
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Text processing
regex = "1.11"
once_cell = "1.20"

# Testing
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
