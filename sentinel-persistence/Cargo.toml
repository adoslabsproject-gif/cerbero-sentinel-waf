[package]
name = "sentinel-persistence"
description = "Sentinel WAF persistence client — fire-and-forget HTTP bridge verso Portal API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Workspace
sentinel-core = { path = "../sentinel-core" }

# Async + HTTP
tokio = { workspace = true }
reqwest = { workspace = true }
backon = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Observability
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tokio-test = { workspace = true }
# Mock HTTP server moderno (axum-based). Standard 2026 per test reqwest.
wiremock = "0.6"
