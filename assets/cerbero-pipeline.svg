<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="A request traversing Cerbero's four defence layers: Edge Shield, Neural Defense, Behavioral, Response">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- One layer box: rounded panel with a pulsing border -->
    <g id="layer">
      <rect x="0" y="0" width="128" height="86" rx="12" fill="#0f1b33" stroke="#1e3a5f" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>

  <!-- Horizontal scan line sweeping the whole pipeline -->
  <rect x="-240" y="18" width="240" height="224" fill="url(#scan)" opacity="0.35">
    <animate attributeName="x" from="-240" to="900" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Title -->
  <text x="34" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#7dd3fc" letter-spacing="2.5">CERBERO · 4 LAYERS · 2–15 ms</text>

  <!-- Pipeline rail -->
  <line x1="34" y1="150" x2="866" y2="150" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Client -->
  <g transform="translate(34,107)">
    <rect width="92" height="86" rx="12" fill="#0f1b33" stroke="#334155" stroke-width="1.5"/>
    <text x="46" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#cbd5e1">client</text>
    <text x="46" y="60" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#64748b">request</text>
  </g>

  <!-- Layer 1 · Edge Shield -->
  <g transform="translate(158,107)">
    <use href="#layer"/>
    <rect x="0" y="0" width="128" height="86" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.12;0.28" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="64" y="34" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#e2e8f0">L1 · Edge Shield</text>
    <text x="64" y="54" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#64748b">rate · IP intel · DDoS</text>
    <text x="64" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#38bdf8">&lt; 1 ms</text>
  </g>

  <!-- Layer 2 · Neural Defense -->
  <g transform="translate(318,107)">
    <use href="#layer"/>
    <rect x="0" y="0" width="128" height="86" rx="12" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.32;0.48" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="64" y="34" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#e2e8f0">L2 · Neural</text>
    <text x="64" y="54" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#64748b">prompt injection · ONNX</text>
    <text x="64" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#a78bfa">&lt; 5 ms</text>
  </g>

  <!-- Layer 3 · Behavioral -->
  <g transform="translate(478,107)">
    <use href="#layer"/>
    <rect x="0" y="0" width="128" height="86" rx="12" fill="none" stroke="#34d399" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.52;0.68" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="64" y="34" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#e2e8f0">L3 · Behavioral</text>
    <text x="64" y="54" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#64748b">profiles · clustering</text>
    <text x="64" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#34d399">&lt; 10 ms</text>
  </g>

  <!-- Layer 4 · Response -->
  <g transform="translate(638,107)">
    <use href="#layer"/>
    <rect x="0" y="0" width="128" height="86" rx="12" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.72;0.88" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="64" y="34" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#e2e8f0">L4 · Response</text>
    <text x="64" y="54" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#64748b">allow · challenge · ban</text>
    <text x="64" y="70" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#fbbf24">adaptive</text>
  </g>

  <!-- Protected app -->
  <g transform="translate(798,107)">
    <rect width="68" height="86" rx="12" fill="#0f2a22" stroke="#34d399" stroke-width="1.5"/>
    <text x="34" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#6ee7b7">app</text>
    <text x="34" y="60" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#34d399">safe</text>
  </g>

  <!-- A legitimate request travelling all the way through -->
  <circle r="6" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="cx" values="126;798" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#38bdf8;#38bdf8;#a78bfa;#34d399;#fbbf24;#6ee7b7" keyTimes="0;0.2;0.42;0.62;0.82;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- An attack stopped at Layer 2: it arrives, flashes red, and is dropped -->
  <g>
    <circle r="5.5" fill="#f87171" filter="url(#glow)" opacity="0">
      <animate attributeName="cx" values="126;382;382" keyTimes="0;0.45;1" dur="5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;150;214" keyTimes="0;0.45;1" dur="5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.55;0.85" dur="5s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="382" y="238" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#f87171" opacity="0">
    BLOCKED
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.45;0.6;0.9" dur="5s" begin="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- Footer note -->
  <text x="866" y="40" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="#475569">single binary · Rust</text>
</svg>
