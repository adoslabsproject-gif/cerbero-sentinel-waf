<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The same payload tokenized two ways: a simplified tokenizer drops the punctuation, the BERT WordPiece tokenizer keeps it">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg2)"/>

  <text x="34" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#7dd3fc" letter-spacing="2.5">TRAIN / SERVE PARITY</text>
  <text x="866" y="38" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="#475569">same payload · two tokenizers</text>

  <!-- The payload -->
  <g transform="translate(34,58)">
    <rect width="832" height="38" rx="9" fill="#0f1b33" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="25" font-family="ui-monospace,monospace" font-size="14" fill="#e2e8f0">&lt;script&gt;alert(1)&lt;/script&gt;</text>
    <text x="816" y="25" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" fill="#64748b">incoming request body</text>
  </g>

  <!-- WRONG: simplified tokenizer -->
  <g transform="translate(34,120)">
    <text x="0" y="0" font-family="ui-monospace,monospace" font-size="11.5" fill="#f87171">✗  simplified: every non-alphanumeric → space</text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.12;0.9;1" dur="7s" repeatCount="indefinite"/>
      <g transform="translate(0,14)">
        <rect width="86" height="30" rx="7" fill="#1f2937" stroke="#475569"/><text x="43" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#cbd5e1">script</text>
      </g>
      <g transform="translate(96,14)">
        <rect width="74" height="30" rx="7" fill="#1f2937" stroke="#475569"/><text x="37" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#cbd5e1">alert</text>
      </g>
      <g transform="translate(180,14)">
        <rect width="40" height="30" rx="7" fill="#1f2937" stroke="#475569"/><text x="20" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#cbd5e1">1</text>
      </g>
      <g transform="translate(230,14)">
        <rect width="86" height="30" rx="7" fill="#1f2937" stroke="#475569"/><text x="43" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#cbd5e1">script</text>
      </g>
      <text x="336" y="34" font-family="ui-monospace,monospace" font-size="11.5" fill="#f87171">4 tokens — the punctuation is gone, and with it the attack shape</text>
    </g>
  </g>

  <!-- RIGHT: BERT WordPiece -->
  <g transform="translate(34,200)">
    <text x="0" y="0" font-family="ui-monospace,monospace" font-size="11.5" fill="#34d399">✓  BERT WordPiece: the tokenizer the model was TRAINED with</text>

    <g transform="translate(0,14)">
      <!-- Each token appears in sequence, so the eye follows the real split -->
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="30" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="15" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">&lt;</text></g>
      <g transform="translate(36,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="86" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="43" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">script</text></g>
      <g transform="translate(128,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="30" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="15" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">&gt;</text></g>
      <g transform="translate(164,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="74" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="37" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">alert</text></g>
      <g transform="translate(244,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="30" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="15" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">(</text></g>
      <g transform="translate(280,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.85s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="30" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="15" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">1</text></g>
      <g transform="translate(316,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="30" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="15" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">)</text></g>
      <g transform="translate(352,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.35s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="30" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="15" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">&lt;</text></g>
      <g transform="translate(388,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="30" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="15" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">/</text></g>
      <g transform="translate(424,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.85s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="86" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="43" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">script</text></g>
      <g transform="translate(516,0)" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.25s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
        <rect width="30" height="30" rx="7" fill="#0f2a22" stroke="#34d399"/><text x="15" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12.5" fill="#6ee7b7">&gt;</text></g>

      <text x="566" y="20" font-family="ui-monospace,monospace" font-size="11.5" fill="#34d399" opacity="0">
        11 tokens — pinned to HuggingFace by a golden fixture
        <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/>
        <animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="0.3s" fill="freeze"/>
      </text>
    </g>
  </g>

  <!-- The measured cost of getting this wrong -->
  <g transform="translate(34,272)">
    <text x="0" y="0" font-family="ui-monospace,monospace" font-size="12" fill="#fbbf24" filter="url(#glow2)">measured on the prompt-injection split:  F1 0.819 → 0.937   ·   recall 0.782 → 0.945   ·   missed attacks 12 → 3</text>
  </g>
</svg>
