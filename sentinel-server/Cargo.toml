[package]
name = "sentinel-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
sentinel-core = { path = "../sentinel-core" }
sentinel-edge = { path = "../sentinel-edge" }
sentinel-neural = { path = "../sentinel-neural" }
sentinel-behavior = { path = "../sentinel-behavior" }
sentinel-response = { path = "../sentinel-response" }
sentinel-persistence = { path = "../sentinel-persistence" }
tokio = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
dashmap = { workspace = true }
once_cell = { workspace = true }
sha2 = "0.10"
# LoRA structured event channel
uuid = { workspace = true }
chrono = { workspace = true }
# G13 (2026-06-02): cross-instance ledger sync via Redis pub/sub
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
futures-util = "0.3"

[dev-dependencies]
tokio-test = { workspace = true }
