services:
  sentinel:
    build: .
    ports:
      - "8080:8080"
    # Tutta la configurazione viene dal file .env (copiato da .env.example).
    # Il file .env non è nel repo: è proprio di ogni installazione.
    env_file:
      - .env
    volumes:
      # Modelli ONNX: 4 file, provisionati sul server (vedi DEPLOY.md).
      - ./models:/opt/sentinel/models:ro
      # Database GeoIP MaxMind: scaricati da scripts/scarica-geoip.sh.
      - ./geoip:/opt/sentinel/geoip:ro
      # Stato persistente (cursore lora, ban store): sopravvive ai riavvii.
      - sentinel-state:/opt/sentinel/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sentinel-state:
